[project]
name = "prism"
version = "0.8.2"
description = "PRISM - Parallel Routing, Inter-model Scoring & Merging across multiple AI models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "anthropic>=1.0",
    "openai>=1.50",
    "google-genai>=1.0",
    "cryptography>=42",
    "playwright>=1.47",
    "pypdf>=5.0",
    "pillow>=10.4",
    "pyyaml>=6.0",
]

[project.scripts]
prism = "prism.__main__:main"
prism-publish = "prism.publish:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prism"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
